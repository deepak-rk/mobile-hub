# Sends "upgrade" only for real upgrade requests, and "close" otherwise, so
# the same location can serve both plain HTTP and WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend (when serving from docker compose).
    # The execution log stream is a WebSocket served under this same prefix
    # (GET /api/execution/:id/stream), so the upgrade headers belong here —
    # without them the socket fails while ordinary HTTP calls keep working.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Long-lived streams must not be cut off by the default read timeout.
        proxy_read_timeout 1h;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
