services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Repo root: the Dockerfile needs the npm workspaces lockfile at the
      # root, not just backend/'s own package.json — see backend/Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/mobilehub
      JWT_SECRET: ${JWT_SECRET}
      # Required because NODE_ENV is production here; the server refuses to
      # start without it rather than exposing the agent endpoints.
      AGENT_TOKEN: ${AGENT_TOKEN}
      API_PORT: "3000"
      EXECUTIONS_DIR: /home/mobilehub/mobile-hub-executions
      BUILDS_DIR: /home/mobilehub/mobile-hub-builds
    volumes:
      - executions:/home/mobilehub/mobile-hub-executions
      - builds:/home/mobilehub/mobile-hub-builds
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # WebSocket traffic (device streams, live execution logs) rides the
        # same origin/port as HTTP — nginx.conf proxies /api/ with upgrade
        # headers, so the frontend needs no separate WS URL.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  executions:
  builds:
