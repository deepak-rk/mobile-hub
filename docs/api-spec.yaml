        '200':
          description: Summary KPIs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /analytics/trend/pass-rate:
    get:
      tags: [analytics]
      summary: Pass rate per day or week
      parameters:
        - { $ref: '#/components/parameters/analyticsFilters' }
      responses:
        '200':
          description: Time-series data points
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnalyticsTrendPoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/trend/volume:
    get:
      tags: [analytics]
      summary: Run volume per day or week, segmented by status
      parameters:
        - { $ref: '#/components/parameters/analyticsFilters' }
      responses:
        '200':
          description: Volume time-series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnalyticsTrendPoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/flakiness:
    get:
      tags: [analytics]
      summary: Flakiness scores by suite (min 3 data points to appear)
      parameters:
        - { $ref: '#/components/parameters/analyticsFilters' }
      responses:
        '200':
          description: Flakiness table
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlakinessSuite' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/devices:
    get:
      tags: [analytics]
      summary: Device utilisation — run count and pass rate per device
      parameters:
        - { $ref: '#/components/parameters/analyticsFilters' }
      responses:
        '200':
          description: Device utilisation list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceUtilisation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /analytics/failures/recent:
    get:
      tags: [analytics]
      summary: Most recent failed runs (reads ExecutionRun directly — always fresh)
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: Recent failures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExecutionRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }

# ─────────────────────────────────────────────────────────────
# Shared analytics filter parameter (referenced above)
# ─────────────────────────────────────────────────────────────
# Note: OpenAPI 3.1 requires parameters to be declared inline or
# under components/parameters. The analyticsFilters ref below is
# a shorthand — expand inline per endpoint during implementation.
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Real-time channels (WebSocket + SSE)
# Not expressible as standard OpenAPI paths — documented here.
# ─────────────────────────────────────────────────────────────

# WS  ws://<host>:3001/ws/stream/:deviceUdid?protocol=mjpeg|h264&token=<jwt>
#
#   Port: STREAM_WS_PORT (default 3001) — separate from REST to bypass
#   HTTP/1.1 6-connection-per-origin limit on grid views with 3+ devices.
#
#   On connect → server sends:
#     { type: "joined", sessionId, retryKey, protocol, viewerCount }
#   While active (H264 only) → binary frames pushed as ArrayBuffer
#   On disconnect → server removes viewer from StreamSession.viewerIds
#   On retryKey change after reconnect → client must flush MSE buffer
#
# WS  ws://<host>:3000/ws/execution/:runId?token=<jwt>
#
#   Port: API_PORT (3000) — same as REST.
#   Stage transition events (not raw log lines — those go via SSE):
#     { type: "stage",  stage, status, startedAt?, endedAt?, error? }
#     { type: "status", status, endedAt? }
#
# WS  ws://<host>:3000/ws/builds/jobs/:jobId?token=<jwt>
#
#   Download progress for an InstallJob:
#     { type: "progress", jobId, progress, downloadedBytes }
#     { type: "complete", jobId, buildId }
#     { type: "error",    jobId, error }
#
# SSE  GET /api/execution/runs/:runId/logs/stream
#
#   See path entry above. EventSource-compatible; auto-reconnects.
#   event: log  → { line, ts }
#   event: done → { status }
